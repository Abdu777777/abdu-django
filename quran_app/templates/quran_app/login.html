{% extends 'quran_app/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-lg">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-quran fa-3x text-primary mb-3"></i>
                    <h3 class="fw-bold">تسجيل الدخول</h3>
                    <p class="text-muted">نظام إدارة حلقات التحفيظ</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <!-- Debug info: admin credentials - username: admin, password: admin123 -->

                        <label class="form-label">اسم المستخدم</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">كلمة المرور</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">دخول</button>
                    </div>
                </form>
                <div class="text-center mt-4">
                    <p class="mb-0">ليس لديك حساب؟ <a href="{% url 'register' %}" class="text-primary fw-bold">أنشئ حساب معلم الآن</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
