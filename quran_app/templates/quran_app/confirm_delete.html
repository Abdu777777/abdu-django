{% extends 'quran_app/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-danger">
            <div class="card-header bg-danger text-white">
                <h3 class="mb-0">تأكيد الحذف</h3>
            </div>
            <div class="card-body text-center">
                <p class="lead">هل أنت متأكد من رغبتك في حذف "{{ object }}"؟</p>
                <p class="text-muted small">هذا الإجراء لا يمكن التراجع عنه.</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4">نعم، احذف</button>
                    <a href="javascript:history.back()" class="btn btn-secondary px-4">إلغاء</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
